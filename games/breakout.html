<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakout · Free Games</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/settings.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="game-header">
      <a class="back" href="../index.html">← All games</a>
      <h1>Breakout</h1>
      <div class="stats"><span>Score <b id="score">0</b></span><span>Lives <b id="lives">3</b></span><span>Level <b id="level">1</b></span><span>Best <b id="best">0</b></span></div>
    </header>
    <main>
      <div class="toolbar">
        <button id="start" type="button">Start</button>
        <button id="restart" type="button" class="secondary">New game</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="stage">
        <canvas id="board" width="480" height="360" aria-label="Breakout game board"></canvas>
      </div>
      <section class="panel help" aria-labelledby="help-h">
        <h2 id="help-h">How to play</h2>
        <ul>
          <li>Move the paddle with the mouse, your finger, or the <kbd>←</kbd> <kbd>→</kbd> (or <kbd>A</kbd> <kbd>D</kbd>) keys.</li>
          <li>Press <kbd>Space</kbd> or click the board to launch the ball. <kbd>Space</kbd> also pauses.</li>
          <li>Break every brick to reach the next level. You have 3 lives.</li>
        </ul>
      </section>
    </main>
  </div>
  <script src="breakout.js"></script>
</body>
</html>
