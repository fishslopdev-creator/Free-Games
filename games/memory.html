<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match · Free Games</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/settings.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="game-header">
      <a class="back" href="../index.html">← All games</a>
      <h1>Memory Match</h1>
      <div class="stats"><span>Moves <b id="moves">0</b></span><span>Pairs <b id="pairs">0</b>/8</span><span>Best <b id="best">–</b></span></div>
    </header>
    <main>
      <div class="toolbar">
        <button id="restart" type="button">New game</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="stage">
        <div id="board" class="cards" aria-label="Cards"></div>
      </div>
      <section class="panel help" aria-labelledby="help-h">
        <h2 id="help-h">How to play</h2>
        <ul>
          <li>Flip two cards at a time. If they match, they stay face up.</li>
          <li>Find all 8 pairs in as few moves as you can.</li>
          <li>Keyboard: <kbd>Tab</kbd> between cards and press <kbd>Enter</kbd> or <kbd>Space</kbd> to flip.</li>
        </ul>
      </section>
    </main>
  </div>
  <script src="memory.js"></script>
</body>
</html>
